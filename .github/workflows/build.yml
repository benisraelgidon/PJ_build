name: Build Pajero firmware

on:
  push:
    branches: [main]
    paths:
      - 'pajero_node.ino'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Find and stage the sketch
        id: find
        run: |
          echo "===== repo tree ====="
          find . -not -path './.git/*' -type f | sort
          echo "====================="
          SKETCH=$(find . -name 'pajero_node.ino' -type f | head -n1)
          if [ -z "$SKETCH" ]; then
            echo "ERROR: pajero_node.ino not found anywhere in the repo"
            exit 1
          fi
          echo "Found sketch at: $SKETCH"
          # Arduino requires the sketch to sit in a folder whose name matches the
          # .ino (pajero_node.ino must live in a folder called pajero_node).
          # Copy it into a clean build/pajero_node/ dir so layout is guaranteed.
          mkdir -p build_sketch/pajero_node
          cp "$SKETCH" build_sketch/pajero_node/pajero_node.ino
          echo "Staged at: build_sketch/pajero_node/pajero_node.ino"
          ls -l build_sketch/pajero_node/
          echo "sketch_dir=build_sketch/pajero_node" >> "$GITHUB_OUTPUT"

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core + libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index

          # The esp32 core pulls a ~250MB toolchain from GitHub's asset server,
          # which intermittently resets the connection. Retry up to 4 times.
          n=0
          until [ $n -ge 4 ]; do
            if arduino-cli core install esp32:esp32@3.0.7; then
              echo "core installed"
              break
            fi
            n=$((n+1))
            echo "core install failed (attempt $n) - retrying in 15s..."
            sleep 15
          done
          if [ $n -ge 4 ]; then
            echo "ERROR: esp32 core failed to install after 4 attempts"
            exit 1
          fi

          arduino-cli lib install "PubSubClient@2.8" "ArduinoJson@6.21.5"

          # TinyGSM fork (lewisxhe) -- the ONLY version with SIM7670G/SIM7672
          # support. git-url installs need this flag enabled explicitly, and we
          # must NOT hide failures (a missing header fails the compile anyway).
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --git-url https://github.com/lewisxhe/TinyGSM-fork.git

          echo "=== confirm TinyGsmClient.h is now present ==="
          if ! find "$HOME/Arduino/libraries" -name 'TinyGsmClient.h' | head -n1 | grep -q .; then
            echo "git-url install did not land the header; falling back to manual clone"
            git clone --depth 1 https://github.com/lewisxhe/TinyGSM-fork.git "$HOME/Arduino/libraries/TinyGSM-fork"
          fi
          find "$HOME/Arduino/libraries" -name 'TinyGsmClient.h' -print

      - name: Show valid board options (for debugging)
        run: |
          echo "=== valid PartitionScheme / PSRAM / FlashSize values for esp32s3 ==="
          arduino-cli board details --fqbn esp32:esp32:esp32s3 2>/dev/null \
            | grep -A40 -iE "PartitionScheme|PSRAM|FlashSize" || true

      - name: Compile
        run: |
          echo "=== confirm staged sketch exists ==="
          ls -l "$GITHUB_WORKSPACE/build_sketch/pajero_node/"
          echo "=== compiling ==="
          # PartitionScheme values are the MENU KEYS from boards.txt (not CSV
          # filenames). app3M_fat9M_16MB = "16M Flash (3MB APP/9.9MB FATFS)",
          # the OTA-capable scheme we flash over USB. FlashSize/PSRAM likewise.
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --export-binaries \
            --output-dir "$GITHUB_WORKSPACE/build_out" \
            "$GITHUB_WORKSPACE/build_sketch/pajero_node"

      - name: Locate and hash the .bin
        id: bin
        run: |
          BIN=$(find "$GITHUB_WORKSPACE/build_out" "$GITHUB_WORKSPACE/build_sketch" -name 'pajero_node.ino.bin' -type f 2>/dev/null | head -n1)
          if [ -z "$BIN" ]; then
            echo "ERROR: compiled .bin not found"
            exit 1
          fi
          cp "$BIN" pajero_node.bin
          SHA=$(sha256sum pajero_node.bin | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### Firmware built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh pajero_node.bin >> "$GITHUB_STEP_SUMMARY"

      - name: Publish as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fw-${{ github.run_number }}
          name: Firmware build ${{ github.run_number }}
          body: |
            Automated build from `main`.

            **SHA-256** (paste into the app's Firmware update box):
            ```
            ${{ steps.bin.outputs.sha }}
            ```

            Download `pajero_node.bin` below, copy its URL, and send URL + SHA from the app.
          files: pajero_node.bin
